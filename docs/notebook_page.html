<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title · Pylea</title>
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0;
  --code-bg: #f6f8fa; --link: #0969da;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d;
    --code-bg: #161b22; --link: #4493f8;
  }
}
body {
  background: var(--bg); color: var(--fg); margin: 0;
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 860px; margin: 0 auto; padding: 16px 16px 64px; }
nav { font-size: 14px; color: var(--muted); padding: 8px 0 16px; border-bottom: 1px solid var(--line); }
nav a { margin-right: 16px; }
a { color: var(--link); }
h1 { font-size: 28px; margin: 24px 0 8px; }
h2 { font-size: 21px; margin: 32px 0 8px; }
pre, code { font: 13.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
:not(pre) > code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.prompt, .anchor-link { display: none; }
.cell { margin: 12px 0; }
.input_area { position: relative; }
.input_area pre {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px 14px; margin: 0; overflow-x: auto;
}
.output_subarea { overflow-x: auto; }
.output_wrapper { margin-top: 8px; }
.output_subarea pre { margin: 0; padding: 0 14px; }
.output_subarea img, .output_subarea svg { max-width: 100%; height: auto; }
.copy {
  position: absolute; top: 6px; right: 6px; font: 12px system-ui, sans-serif;
  color: var(--muted); background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 8px; cursor: pointer; opacity: 0.8;
}
.copy:hover { opacity: 1; }
$highlight
</style>
</head>
<body>
<main>
<nav><a href="../pylea.html">Pylea documentation</a><a href="$notebook" download>Download notebook</a></nav>
$body
</main>
<script>
for (const pre of document.querySelectorAll(".code_cell .input_area pre")) {
  const button = document.createElement("button");
  button.className = "copy";
  button.textContent = "Copy";
  button.addEventListener("click", async () => {
    await navigator.clipboard.writeText(pre.innerText);
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = "Copy"; }, 1500);
  });
  pre.parentElement.appendChild(button);
}
</script>
</body>
</html>

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every Python version pyproject.toml admits that has been released.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest

  # The slow marker holds the statistical coverage grids that validate the sampling
  # certificates' confidence guarantee; the default addopts deselect them, so they get
  # their own job.
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      - run: pytest -m slow
